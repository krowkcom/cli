# The engine behind `krowk -p`: one model loop, its event model, the session
# log and the in-process client protocol. Compiled into `krowk` only by the
# `harness` feature, so the agent build links none of what is below — every
# dependency here pays rent against the size and RSS budgets, and says what
# it buys.
[package]
name = "krowk-harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
# The log projects into krowk.db through the same writer the importers use.
krowk-store = { path = "../krowk-store" }
krowk-import = { path = "../krowk-import" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# The protocol's JSON Schema, and the tools' input schemas, derived from the
# Rust types rather than written beside them (R-PROTO-2).
schemars = { version = "1", default-features = false, features = ["derive", "std", "preserve_order"] }
# The async runtime lives here and nowhere else: a model stream, a tool
# process and an interrupt are three things one turn waits on at once.
tokio = { version = "1", default-features = false, features = ["rt", "time", "process", "io-util", "sync", "signal", "macros"] }
# Streaming HTTP for the provider APIs. rustls on ring and the platform
# verifier: the TLS stack the lean build's ureq already carries, so the
# certificates krowk trusts are the same on both paths.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-manual-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.7"
sha2 = "0.11"

[target.'cfg(unix)'.dependencies]
# Killing a timed-out bash call's whole process group.
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "net", "macros", "io-util", "time"] }
# Validates recorded session logs against the generated schema in tests only.
jsonschema = { version = "0.57", default-features = false }
