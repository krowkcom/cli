[[budget]]
id = "tui.redraw_fps"
req = "R-PERF-4"
what = "TUI under a synthetic token stream: redraws per second"
unit = "fps"
max = 60
status = "pending"
owner = "04"

[[budget]]
id = "remote.attach"
req = "R-PERF-6"
what = "Attach from a checkpoint on a remote device"
unit = "ms"
max = 500
status = "pending"
owner = "19"
