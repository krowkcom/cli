name: Packaging

# The release workflow only runs on a tag, which is the worst moment to learn
# that the packaging is broken. This builds the same layout on every change to
# it — every platform, archived and checksummed — then packs the npm packages,
# installs through the installer, and runs each binary where it runs. Nothing
# is published and no secret is needed.
#
# The build is the fast profile: no LTO, so the binaries are larger and
# slower, and in every other way the ones a release ships — the same targets,
# static where they are static, in the same archives.
on:
  pull_request:
    paths: &paths
      - .cargo/**
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - npm/**
      - scripts/dist.sh
      - scripts/install.sh
      - scripts/install_test.sh
      - .github/workflows/dist.yml
      - .github/workflows/packaging.yml
      - .github/workflows/release.yml
      - Makefile
  push:
    branches: [main]
    paths: *paths

permissions:
  contents: read

jobs:
  dist:
    uses: ./.github/workflows/dist.yml
    with:
      version: 0.0.0-snapshot
      fast: true

  packaging:
    needs: dist
    # macOS arm64: the npm launcher and the installer run for the host, and
    # this is the platform most people install on.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install shellcheck
        run: brew install shellcheck

      # Also checks the platform tables in npm/build.mjs and both launchers
      # still name the platforms the release built.
      - name: Assemble the npm packages
        run: node npm/build.mjs

      # Tarballs, not the staged directories: npm links a local directory
      # dependency, and Node resolving through the symlink would look for the
      # platform package somewhere a real install never would.
      - name: Pack the packages
        run: |
          set -eu
          mkdir -p dist/npm-tarballs
          for pkg in dist/npm/*/; do
            echo "── $pkg"
            npm pack --pack-destination "$PWD/dist/npm-tarballs" "$pkg"
          done

      # The launcher can only be exercised on the runner's own platform, but
      # that is the path every `npx @krowk/cli` takes, so it is worth taking.
      - name: Run both binaries through the npm launchers
        run: |
          set -eux
          version="$(node -p 'require("./dist/npm/manifest.json").version')"
          work="$(mktemp -d)"
          cd "$work"
          npm init -y >/dev/null
          npm install --no-audit --no-fund \
            "$GITHUB_WORKSPACE/dist/npm-tarballs/krowk-cli-darwin-arm64-$version.tgz" \
            "$GITHUB_WORKSPACE/dist/npm-tarballs/krowk-cli-$version.tgz" \
            "$GITHUB_WORKSPACE/dist/npm-tarballs/krowk-mcp-$version.tgz"
          test "$(./node_modules/.bin/krowk --version)" = "$version"
          test "$(./node_modules/.bin/krowk-mcp --version)" = "$version"
          ./node_modules/.bin/krowk --help >/dev/null

      # Serves the archives and checksums.txt the build above wrote and
      # installs out of them, so what is tested is the release rather than a
      # tarball the test rolled itself.
      - name: Install from the build above
        run: scripts/install_test.sh

  # Static means static: the musl builds run in a container with no libc of
  # ours, on each architecture, natively.
  linux:
    needs: dist
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            triple: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            triple: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      # Alpine through docker rather than as the job container: the runner's
      # JavaScript actions (download-artifact above) do not run inside an
      # arm64 Alpine container.
      - name: Run both binaries in Alpine
        run: |
          chmod +x dist/${{ matrix.triple }}/*
          docker run --rm -v "$PWD/dist:/d:ro" -e KROWK_NO_UPDATE_CHECK=1 -e HOME=/tmp/h alpine:3 sh -euxc '
            mkdir -p "$HOME"
            /d/${{ matrix.triple }}/krowk --version
            /d/${{ matrix.triple }}/krowk-mcp --version
            /d/${{ matrix.triple }}/krowk sessions import --from all --json
            /d/${{ matrix.triple }}/krowk doctor --json
            printf "%s\n" "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"ping\"}" | /d/${{ matrix.triple }}/krowk-mcp
          '

  windows:
    needs: dist
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      # sessions answers unsupported_os on Windows in v1; everything else runs.
      - name: Run both binaries
        env:
          KROWK_NO_UPDATE_CHECK: "1"
        run: |
          set -eux
          bin=dist/x86_64-pc-windows-gnu
          $bin/krowk.exe --version
          $bin/krowk-mcp.exe --version
          $bin/krowk.exe --help >/dev/null
          set +e
          $bin/krowk.exe sessions --json 2> err.json
          code=$?
          set -e
          cat err.json
          test "$code" = 1
          grep -q unsupported_os err.json
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"ping"}' | $bin/krowk-mcp.exe
