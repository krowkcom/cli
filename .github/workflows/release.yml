name: Release

# A tag is the whole trigger. `git tag -a v0.1.0 -m ... && git push origin v0.1.0`
# builds both binaries for five platforms, opens the GitHub Release with the
# archives and checksums on it, and publishes the seven npm packages.
#
# Three components, deliberately: the moving major tag this workflow pushes at
# the end is also `v*`, and a release run for `v0` would ask GoReleaser to cut
# a release of version "0" and npm to publish it.
on:
  push:
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # GoReleaser creates the release and uploads the archives to it.
      contents: write
      # setup-go needs this to save its build cache; without it every run
      # ends in "cache write denied: token has no writable scopes".
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # GoReleaser reads the tag and the commits since the last one to build
          # the changelog, so a shallow clone gives it nothing to work with.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # The same gate as a pull request. A tag that cannot pass it should not
      # become bytes anyone downloads.
      - name: Check
        run: make check

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Build the release
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Reads the binaries GoReleaser just built out of dist/, so the npm
      # packages carry the same bytes the checksums cover.
      - name: Assemble the npm packages
        run: node npm/build.mjs

      # Skips with a notice when NPM_TOKEN is unset, which it is until somebody
      # claims the names. The release above has already happened by then.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node npm/publish.mjs

      # The moving major tag, so `uses: krowkcom/cli@v0` follows the 0.x line
      # instead of freezing a workflow on one patch release. It moves last, once
      # the release exists and npm carries the packages: a tag pointing at bytes
      # nobody can download yet is worse than a tag that lags by a minute.
      #
      # Pushed through the API rather than git, because the checkout above keeps
      # no credentials on disk. A ref moved by GITHUB_TOKEN starts no workflow
      # run either way, and the narrowed trigger above would ignore it.
      - name: Move the major tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # A prerelease is not what `@v0` should hand an unsuspecting workflow.
          case "$GITHUB_REF_NAME" in
            *-*)
              echo "::notice::$GITHUB_REF_NAME is a prerelease, so the major tag stays where it is"
              exit 0
              ;;
          esac
          major="${GITHUB_REF_NAME%%.*}"
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$major" \
            -f sha="$GITHUB_SHA" -F force=true >/dev/null \
            || gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$major" -f sha="$GITHUB_SHA" >/dev/null
          echo "\`$major\` now points at $GITHUB_REF_NAME." >> "$GITHUB_STEP_SUMMARY"
