# go.mod declares the language version the code needs; this pins the toolchain
# that builds it, so `make check` works on a clean checkout without a global
# default set.
#
# goreleaser and node are here for the same reason, one step further out: they
# are what turns a tag into downloadable bytes, so `make release-check` and
# `make dist` work on a clean checkout too. Neither is needed for `make check`.
[tools]
go = "1.26.5"
goreleaser = "2"
node = "22"
