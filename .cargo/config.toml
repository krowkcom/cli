# The SQLite that `sessions` compiles in, without the extras libsqlite3-sys
# bundles by default: full-text search, R*Tree, dbstat, STAT4, column
# metadata and extension loading. krowk.db uses none of them; dropping them
# saves ~270 KB and takes extension loading off the attack surface. A later
# -U cancels the crate's own -D, so this only ever removes.
[env]
LIBSQLITE3_FLAGS = "-USQLITE_ENABLE_FTS3 -USQLITE_ENABLE_FTS3_PARENTHESIS -USQLITE_ENABLE_FTS5 -USQLITE_ENABLE_RTREE -USQLITE_ENABLE_DBSTAT_VTAB -USQLITE_ENABLE_STAT4 -USQLITE_ENABLE_COLUMN_METADATA -USQLITE_ENABLE_LOAD_EXTENSION -DSQLITE_OMIT_LOAD_EXTENSION -DSQLITE_OMIT_DEPRECATED -DSQLITE_OMIT_SHARED_CACHE -DSQLITE_DEFAULT_MEMSTATUS=0 -DSQLITE_DQS=0"
